<div class="row">
  <div class="col-12 mb-3">
    <button class="btn btn-primary" (click)="addTrip()">Add Trip</button>
  </div>
  @if (trips.length > 0) {
    @for (trip of trips; track trip.code) {
      <div class="col-md-4">
        <app-trip-card [trip]="trip" class="mt-2"></app-trip-card>
      </div>
    }
  }
</div>
